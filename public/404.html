<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - WindFleet</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #1B8094; /* --color-primary */
            color: #ffffff; /* Default white text */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            box-sizing: border-box;
        }
        .content-box {
            background-color: #ffffff;
            color: #333333; /* --color-neutral-dark */
            padding: 2rem 2rem; /* Approx p-8 */
            border-radius: 0.5rem; /* rounded-lg */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-xl */
            text-align: center;
            max-width: 28rem; /* max-w-md */
            width: 100%;
        }
        .logo {
            width: 6rem; /* w-24 */
            height: 6rem; /* h-24 */
            margin-bottom: 1.5rem; /* mb-6 */
            margin-left: auto;
            margin-right: auto;
        }
        h1 {
            font-size: 1.5rem; /* text-2xl */
            line-height: 2rem;
            font-weight: 600; /* font-semibold */
            margin-bottom: 0.5rem; /* mb-2 */
        }
        p {
            font-size: 1.125rem; /* text-lg */
            line-height: 1.75rem;
            color: #4b5563; /* text-gray-600 */
            margin-bottom: 2rem; /* mb-8 */
        }
        a.button {
            display: inline-block;
            padding: 0.5rem 1.5rem; /* px-6 py-2 */
            font-size: 0.875rem; /* text-sm */
            line-height: 1.25rem;
            font-weight: 600; /* font-semibold */
            color: #ffffff;
            background-color: #1B8094; /* --color-primary */
            border-radius: 0.375rem; /* rounded-md */
            text-decoration: none;
            transition: background-color 0.2s ease-in-out;
        }
        a.button:hover {
            background-color: #33AAB3; /* --color-teal-light */
        }
        /* Basic responsive padding */
        @media (min-width: 768px) {
            .content-box {
                padding: 3rem; /* md:p-12 */
            }
        }
    </style>
</head>
<body>
    <div class="content-box">
        <img src="/WindFleet Logo SVG.svg" alt="WindFleet Logo" class="logo">
        <h1>Entering Stormy Waters...</h1>
        <p>Page Not Found (404)</p>
        <a href="/" class="button">Return to Dashboard</a>
    </div>
</body>
</html>
